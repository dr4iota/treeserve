[package]
name = "treeserve"
version = "0.1.0"
edition = "2024"
description = "Single-binary file/code tree server with server-rendered syntax highlighting, markdown and dark/light themes — zero JS"
license = "MIT OR Apache-2.0"
keywords = ["file-server", "http", "markdown", "syntax-highlighting", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
comrak = { version = "0.52.0", default-features = false }
syntect = "5.3.0"
tiny_http = "0.12.0"
two-face = "0.5.1"

[profile.release]
lto = true
strip = true
