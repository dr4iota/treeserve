[workspace]
members = ["app"]
# `cargo build` at the root builds only the server and CLI; the desktop app
# needs system webview libraries, so it is opt-in via `-p treeserve-app`.
default-members = ["."]

[package]
name = "treeserve"
version = "0.1.0"
edition = "2024"
description = "Single-binary file/code tree server with server-rendered syntax highlighting, markdown, LaTeX math and dark/light themes — zero JS"
license = "MIT OR Apache-2.0"
keywords = ["file-server", "http", "markdown", "syntax-highlighting", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
comrak = { version = "0.52.0", default-features = false }
pulldown-latex = "0.8.0"
syntect = "5.3.0"
tiny_http = "0.12.0"
two-face = "0.5.1"

[profile.release]
lto = true
strip = true
