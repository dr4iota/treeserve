[workspace]
members = ["app"]
# `cargo build` at the root builds only the server and CLI; the desktop app
# needs system webview libraries, so it is opt-in via `-p treesight`.
default-members = ["."]

[package]
name = "treeserve"
version = "0.1.0"
edition = "2024"
description = "Single-binary file/code tree server with server-rendered syntax highlighting, markdown, Mermaid diagrams, LaTeX math and dark/light themes — zero JS"
license = "MIT OR Apache-2.0"
keywords = ["file-server", "http", "markdown", "syntax-highlighting", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
comrak = { version = "0.52.0", default-features = false }
libm = "0.2"
mermaid-rs-renderer = { version = "0.3", default-features = false }
pulldown-latex = "0.8.0"
syntect = { version = "5.3.0", default-features = false }
tiny_http = "0.12.0"
two-face = { version = "0.5.1", default-features = false }

[features]
default = ["onig"]
# Highlighting regex engine. `onig` is oniguruma, a C library built by cc:
# roughly twice as fast and a smaller binary, and the default. `pure` swaps in
# fancy-regex so the whole dependency tree is Rust, which is what makes static
# musl builds and cross-compilation painless. Output is identical either way.
onig = ["syntect/default-onig", "two-face/syntect-onig"]
pure = ["syntect/default-fancy", "two-face/syntect-fancy"]

[profile.release]
lto = true
strip = true
